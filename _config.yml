collections:
  homepage:
    output: true
    sort_by: date
    permalink: /:path:output_ext
  CV:
    output: true
    sort_by: date
  research:
    output: true
    sort_by: date
  projects:
    output: true
    sort_by: date
  talks:
    output: true
    sort_by: date
  teaching:
    output: true
    sort_by: date
collections_dir: pages
defaults:
  - values:
      layout: "default"
      language: zh
  - scope:
      type: "posts"
    values:
      permalink: /news/:title.html
description: "Shuo Li is an Assistant Professor at the Institute of Insurance Application and Innovation, Fudan University, working on environmental, health, and development economics."
description_zh: "李硕，复旦大学保险应用创新研究院研究员，研究方向为环境经济学、健康经济学与发展经济学。"
exclude:
  - maintenance/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - "*.less"
  - "*.psd"
kramdown:
  syntax_highlighter_opts:
    css_class: "highlight"
markdown: kramdown
name: Shuo Li
name_zh: 李硕
plugins:
  - jekyll-sitemap
  - jekyll-sass-converter
timezone: Asia/Hong Kong
title: Shuo Li's Website
url: #url
